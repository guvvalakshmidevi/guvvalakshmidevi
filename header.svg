<svg width="900" height="280" viewBox="0 0 900 280"
     xmlns="http://www.w3.org/2000/svg">

  <rect width="900" height="280" rx="20" fill="#071A33"/>

  <!-- Name -->
  <text x="450" y="125"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="48"
        font-weight="bold"
        fill="#FFFFFF">
    LAKSHMIDEVI GUVVA

    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 -180"
      to="0 0"
      dur="1.2s"
      begin="0s"
      fill="freeze"
      calcMode="spline"
      keySplines="0.2 0.8 0.2 1"/>
  </text>

  <!-- Developer Title -->
  <text x="450" y="180"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="27"
        fill="#7DD3FC">
    Java Full Stack Developer

    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 -120"
      to="0 0"
      dur="1s"
      begin="0.8s"
      fill="freeze"
      calcMode="spline"
      keySplines="0.2 0.8 0.2 1"/>
  </text>

</svg>
