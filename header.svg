<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <style>
    .bg { fill: #000080; }
    .title {
      fill: #ffffff;
      font-size: 54px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      opacity: 0;
      animation: fadeIn 3s infinite;
    }
    .sub {
      fill: #dbe9ff;
      font-size: 28px;
      font-family: Arial, sans-serif;
      opacity: 0;
      animation: fadeIn2 3s infinite;
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      20% { opacity: 1; transform: translateY(0); }
      70% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes fadeIn2 {
      0% { opacity: 0; transform: translateY(20px); }
      35% { opacity: 1; transform: translateY(0); }
      80% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>

  <rect class="bg" width="1200" height="320" />
  <text x="80" y="120" class="title">Java Full Stack Developer</text>
  <text x="80" y="180" class="sub">Learning Java • Spring Boot • SQL</text>
</svg>
