<svg width="1000" height="360"
     viewBox="0 0 1000 360"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Navy Background -->
  <rect width="1000" height="360"
        rx="25"
        fill="#061A33"/>

  <!-- Decorative Lines -->
  <line x1="350" y1="55" x2="650" y2="55"
        stroke="#1597E5"
        stroke-width="2"/>

  <!-- NAME -->
  <text x="500"
        y="150"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="55"
        font-weight="bold"
        letter-spacing="2"
        fill="#FFFFFF">

    LAKSHMIDEVI GUVVA

    <!-- Whole name falls together -->
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 -180"
      to="0 0"
      dur="1.3s"
      begin="0s"
      fill="freeze"
      calcMode="spline"
      keySplines="0.2 0.8 0.2 1"/>
  </text>


  <!-- TITLE -->
  <text x="500"
        y="215"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="30"
        font-weight="600"
        letter-spacing="1"
        fill="#5CC8FF">

    JAVA FULL STACK DEVELOPER

    <!-- Title falls after name -->
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 -130"
      to="0 0"
      dur="1.1s"
      begin="0.7s"
      fill="freeze"
      calcMode="spline"
      keySplines="0.2 0.8 0.2 1"/>
  </text>


  <!-- Small tagline -->
  <text x="500"
        y="265"
        text-anchor="middle"
        font-family="monospace"
        font-size="18"
        fill="#B8DFFF">

    &lt; Code • Learn • Build /&gt;

  </text>

</svg>
