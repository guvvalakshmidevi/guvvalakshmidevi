<svg width="1000" height="330" viewBox="0 0 1000 330"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Navy Background -->
  <rect width="1000" height="330" rx="24" fill="#06152B"/>

  <!-- Blue Border -->
  <rect x="8" y="8" width="984" height="314"
        rx="22" fill="none"
        stroke="#1683FF"
        stroke-width="2"/>

  <!-- Profile Photo -->
  <g>
    <circle cx="155" cy="165" r="105"
            fill="#0B2344"
            stroke="#1683FF"
            stroke-width="4"/>

    <image
      href="./profile.jpg"
      x="65"
      y="75"
      width="180"
      height="180"
      preserveAspectRatio="xMidYMid slice"
      clip-path="circle(90px at 90px 90px)"/>
  </g>

  <!-- Everything on the right falls together -->
  <g>

    <!-- Name -->
    <text x="620" y="135"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="52"
          font-weight="bold"
          fill="#FFFFFF">
      LAKSHMIDEVI GUVVA
    </text>

    <!-- Developer Title -->
    <text x="620" y="190"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="29"
          font-weight="bold"
          fill="#38BDF8">
      JAVA FULL STACK DEVELOPER
    </text>

    <!-- Short tagline -->
    <text x="620" y="235"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="18"
          fill="#B8D9FF">
      Code • Learn • Build • Grow
    </text>

    <!-- One complete falling animation -->
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 -180"
      to="0 0"
      dur="1.4s"
      begin="0s"
      fill="freeze"
      calcMode="spline"
      keySplines="0.20 0.80 0.20 1"/>

  </g>

  <!-- Decorative Java symbol -->
  <text x="930" y="290"
        text-anchor="middle"
        font-family="Arial"
        font-size="28"
        fill="#1683FF">☕</text>

</svg>
