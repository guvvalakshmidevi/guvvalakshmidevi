<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <rect width="1200" height="320" fill="#000080"/>

  <style>
    .title {
      fill: #ffffff;
      font-family: Arial, sans-serif;
      font-size: 56px;
      font-weight: bold;
      opacity: 0;
      animation: fall 3s ease-in-out infinite;
    }

    .sub {
      fill: #dbe9ff;
      font-family: Arial, sans-serif;
      font-size: 28px;
      opacity: 0;
      animation: fall2 3s ease-in-out infinite;
    }

    .tag {
      fill: #ffffff;
      font-family: Arial, sans-serif;
      font-size: 22px;
      font-style: italic;
      opacity: 0.9;
    }

    @keyframes fall {
      0% { transform: translateY(-80px); opacity: 0; }
      20% { transform: translateY(0); opacity: 1; }
      80% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(80px); opacity: 0; }
    }

    @keyframes fall2 {
      0% { transform: translateY(-60px); opacity: 0; }
      35% { transform: translateY(0); opacity: 1; }
      85% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(60px); opacity: 0; }
    }
  </style>

  <text x="80" y="125" class="title">Your Name</text>
  <text x="80" y="185" class="sub">Java Full Stack Developer</text>
  <text x="80" y="245" class="tag">Code. Build. Achieve.</text>
</svg>
